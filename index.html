<!doctype html>
<html lang="en">
<head>

<meta charset="utf-8" />

<meta
  name="viewport"
  content="width=device-width, initial-scale=1"
/>

<title>Ameer Shehadeh</title>

<meta
  name="description"
  content="Ameer Shehadeh — Credit Repair Services"
/>

<link
  rel="shortcut icon"
  href="./img/logo.jpg"
  type="image/x-icon"
/>

<!-- Font Awesome -->
<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
/>

<style>

  :root{
    --bg:#0b0b0d;
    --card:#111114;
    --text:#ffffff;
    --muted:#cfcfd6;

    --red:#de2020;
    --red2:#ff3b3b;

    --stroke:rgba(222,32,32,.35);

    --shadow:
      0 22px 60px rgba(0,0,0,.65);

    --radius:20px;
  }

  *{
    margin:0;
    padding:0;
    box-sizing:border-box;
  }

  body{
    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:32px 16px;

    font-family:
      system-ui,
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      Roboto,
      Arial,
      sans-serif;

    color:var(--text);

    background:
      radial-gradient(
        900px 520px at 50% -10%,
        rgba(222,32,32,.22),
        transparent 60%
      ),

      radial-gradient(
        700px 420px at 10% 20%,
        rgba(255,59,59,.12),
        transparent 55%
      ),

      linear-gradient(
        160deg,
        #0f0f12,
        var(--bg)
      );
  }

  .wrap{
    width:min(560px,100%);
  }

  .card{
    position:relative;

    overflow:hidden;

    border-radius:var(--radius);

    background:
      linear-gradient(
        180deg,
        rgba(17,17,20,.92),
        rgba(10,10,12,.92)
      );

    border:
      1px solid var(--stroke);

    box-shadow:var(--shadow);
  }

  .topGlow{
    position:absolute;

    inset:-220px -140px auto -140px;

    height:280px;

    background:
      radial-gradient(
        circle at center,
        rgba(222,32,32,.28),
        transparent 70%
      );

    pointer-events:none;
  }

  header{
    position:relative;
    z-index:2;

    text-align:center;

    padding:32px 24px 18px;
  }

  .logo{
    width:120px;
    height:120px;

    margin:auto;

    border-radius:50%;
    overflow:hidden;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#0b0b0d;

    border:
      2px solid rgba(222,32,32,.55);

    box-shadow:
      0 12px 34px rgba(0,0,0,.55);
  }

  .logo img{
    width:100%;
    height:100%;

    display:block;
    object-fit:contain;
  }

  h1{
    margin-top:16px;

    font-size:28px;
    font-weight:800;

    letter-spacing:.4px;
  }

  .sub{
    margin-top:6px;

    color:var(--muted);

    font-size:15px;

    letter-spacing:1px;

    text-transform:uppercase;
  }

  .content{
    padding:0 20px 24px;
  }

  .btn{
    width:100%;

    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;

    text-decoration:none;
    color:var(--text);

    padding:16px;
    margin:14px 0;

    border-radius:16px;

    border:
      1px solid rgba(222,32,32,.35);

    background:
      rgba(255,255,255,.04);

    font-size:16px;
    font-weight:700;

    letter-spacing:.2px;

    box-shadow:
      0 12px 30px rgba(0,0,0,.35);

    transition:
      transform .2s ease,
      box-shadow .2s ease,
      filter .2s ease;
  }

  .btn i{
    font-size:18px;
  }

  .btn:hover{
    transform:translateY(-2px);

    filter:brightness(1.05);

    box-shadow:
      0 14px 38px rgba(0,0,0,.45);
  }

  /* WhatsApp Button */

  .btn.primary{
    background:
      linear-gradient(
        135deg,
        #25d366,
        #128c7e
      );

    border:
      1px solid rgba(0,0,0,.25);
  }

  footer{
    text-align:center;

    padding:18px;

    color:rgba(207,207,214,.9);

    font-size:13px;
  }

  @media (max-width:460px){

    header{
      padding:26px 18px 14px;
    }

    .logo{
      width:100px;
      height:100px;
    }

    h1{
      font-size:24px;
    }

    .btn{
      font-size:15px;
      padding:15px;
    }

    .content{
      padding:0 14px 20px;
    }
  }

</style>

</head>

<body>

<main class="wrap">

  <section
    class="card"
    aria-label="Ameer Shehadeh Links"
  >

    <div class="topGlow"></div>

    <header>

      <div class="logo">

        <img
          src="./img/logo.jpg"
          alt="Ameer Shehadeh Logo"
        />

      </div>

      <h1>Ameer Shehadeh</h1>

      <p class="sub">
        Credit Repair
      </p>

    </header>

    <div class="content">

      <!-- WhatsApp -->

      <a
        class="btn primary"
        href="https://wa.me/13477914650"
        target="_blank"
      >
        <i class="fa-brands fa-whatsapp"></i>

        +1 (347) 791-4650
      </a>

      <!-- Email -->

      <a
        class="btn"
        href="mailto:Princerepair03@gmail.com"
      >
        <i class="fa-solid fa-envelope"></i>

        Princerepair03@gmail.com
      </a>

      <!-- Website -->

      <a
        class="btn"
        href="https://princerepair.com"
        target="_blank"
        rel="noopener"
      >
        <i class="fa-solid fa-globe"></i>

        Princerepair.com
      </a>

      <!-- Instagram -->

      <a
        class="btn"
        href="https://instagram.com/princerepair"
        target="_blank"
        rel="noopener"
      >
        <i class="fa-brands fa-instagram"></i>

        @princerepair
      </a>

    </div>

    <footer>

      ©
      <span id="y"></span>

      Ameer Shehadeh · All rights reserved

    </footer>

  </section>

</main>

<script>

  document.getElementById("y").textContent =
    new Date().getFullYear();

</script>

</body>
</html>
